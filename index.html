<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nanae Itoi — Interdisciplinary Artist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a href="index.html" class="logo">NANAE ITOI</a>
  <ul>
    <li><a href="index.html" class="active">Home</a></li>
    <li><a href="portfolio.html">Portfolio</a></li>
    <li><a href="events.html">Events</a></li>
    <li><a href="bio.html">Bio</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <button class="nav-toggle" aria-label="Toggle menu">☰</button>
</nav>

<header class="hero">
  <div class="hero-carousel-wrap">
    <div class="hero-carousel">
      <div class="hero-track">
        <div class="hero-slide">
          <video src="asset/2026/video/compressed/buccalcone/WhaleJune2026/Whale1_June2026_web.mp4" autoplay muted loop playsinline></video>
        </div>
        <div class="hero-slide">
          <img src="asset/2026/img/Kumamoto/KanamiBlue%202.jpg" alt="Interactive projection installation, blue world map motif">
        </div>
        <div class="hero-slide">
          <video src="asset/2025/video/compressed/fpojMay2025_web.mp4" autoplay muted loop playsinline></video>
        </div>
        <div class="hero-slide">
          <video src="asset/2026/video/compressed/AngelFeb2026Clip1_web.mp4" autoplay muted loop playsinline></video>
        </div>
      </div>
    </div>
    <button class="hero-arrow prev" aria-label="Previous slide">‹</button>
    <button class="hero-arrow next" aria-label="Next slide">›</button>
    <div class="hero-dots">
      <button class="hero-dot active" aria-label="Go to slide 1"></button>
      <button class="hero-dot" aria-label="Go to slide 2"></button>
      <button class="hero-dot" aria-label="Go to slide 3"></button>
      <button class="hero-dot" aria-label="Go to slide 4"></button>
    </div>
    <div class="scroll-hint">Scroll</div>
    <div class="hero-content">
      <div class="hero-eyebrow">Interdisciplinary Artist</div>
      <h1>Nanae<br>Itoi</h1>
      <p class="hero-sub">Working across body, image, and space — making work that explores the edges between technology and perception.</p>
    </div>
  </div>
</header>

<script src="nav.js"></script>
<script>
(function(){
  const track = document.querySelector('.hero-track');
  const slides = document.querySelectorAll('.hero-slide');
  const dots = document.querySelectorAll('.hero-dot');
  const prevBtn = document.querySelector('.hero-arrow.prev');
  const nextBtn = document.querySelector('.hero-arrow.next');
  const total = slides.length;
  let index = 0;

  function update(){
    track.style.transform = `translateX(-${index * 100}%)`;
    dots.forEach((d, i) => d.classList.toggle('active', i === index));
  }
  function goTo(i){
    index = (i + total) % total;
    update();
  }

  prevBtn.addEventListener('click', () => { goTo(index - 1); resetAutoplay(); });
  nextBtn.addEventListener('click', () => { goTo(index + 1); resetAutoplay(); });
  dots.forEach((d, i) => d.addEventListener('click', () => { goTo(i); resetAutoplay(); }));

  const wrap = document.querySelector('.hero-carousel-wrap');
  let autoplayTimer = null;
  const AUTOPLAY_DELAY = 5000;

  function startAutoplay(){
    autoplayTimer = setInterval(() => goTo(index + 1), AUTOPLAY_DELAY);
  }
  function resetAutoplay(){
    clearInterval(autoplayTimer);
    startAutoplay();
  }

  if (total > 1) {
    startAutoplay();
    wrap.addEventListener('mouseenter', () => clearInterval(autoplayTimer));
    wrap.addEventListener('mouseleave', startAutoplay);
  }
})();
</script>
</body>
</html>
